<main class="section nameplate-page">
  <div class="nameplate-heading">
    <span class="eyebrow">OGS / KEYRING STUDIO</span>
    <h1>客製你的姓名鑰匙圈。</h1>
    <p>輸入名字，選好字型和底板，再為你的鑰匙圈配色。</p>
  </div>
  <div class="nameplate-workspace">
    <figure class="nameplate-stage">
      <div class="plate-view-header">
        <span class="eyebrow">LIVE 3D PREVIEW</span>
        <button class="text-button" id="plate-reset-view" type="button" hidden>重置視角</button>
      </div>
      <div class="plate-view" id="plate-view" tabindex="0" aria-label="3D 鑰匙圈預覽，拖曳或使用方向鍵旋轉">
        <canvas id="plate-canvas" hidden></canvas>
      <svg id="plate-preview" viewBox="0 0 90 43" role="img" aria-label="名牌即時預覽" fill-rule="evenodd">
        <g id="plate-position">
          <path data-outline="base" class="plate-contour-side" transform="translate(0 1.4)"/>
          <path data-outline="base" class="plate-contour"/>
          <path data-outline="lettering" class="plate-shadow" transform="translate(0 .5)"/>
          <path data-outline="lettering" class="plate-face"/>
        </g>
      </svg>
      </div>
      <p class="plate-view-hint" id="plate-view-hint" hidden>拖曳旋轉 · 捏合縮放</p>
      <p id="plate-preview-status" role="status" data-loading="正在生成輪廓…" data-error="這組文字無法生成完整底板，請縮短姓名或換一種底板造型。"></p>
      <figcaption>畫面為設計示意，實際成品顏色與尺寸依製作確認為準。</figcaption>
    </figure>
    <form id="nameplate-form" class="nameplate-form">
      <ol class="keyring-steps" aria-label="客製步驟">
        <li aria-current="step"><span>01</span> 名字與造型</li>
        <li><span>02</span> 選顏色</li>
      </ol>
      <section class="keyring-step" id="keyring-design">
        <h2 tabindex="-1">名字與造型</h2>
        <div class="nameplate-field">
          <label for="plate-name">姓名文字</label>
          <input id="plate-name" name="nameText" maxlength="20" placeholder="你的名字" required pattern=".*\S.*" autocomplete="off">
        </div>
        <div class="nameplate-field">
          <label for="plate-style">字形風格</label>
          <select id="plate-style" name="style">
            <option value="huninn">粉圓 · 中英文</option>
            <option value="sans-tc">繁體黑體 · Sans Serif</option>
            <option value="serif-tc">繁體宋體 · Serif</option>
            <option value="sans-sc">簡體黑體 · Sans Serif</option>
            <option value="serif-sc">簡體宋體 · Serif</option>
          </select>
        </div>
        <fieldset class="keyring-shapes">
          <legend>底板造型</legend>
          <label><input type="radio" name="shape" value="contour" checked>
            <img class="keyring-template" src="assets/keyring/contour.svg" alt=""><span>隨字輪廓</span>
          </label>
          <label><input type="radio" name="shape" value="capsule">
            <img class="keyring-template" src="assets/keyring/capsule.svg" alt=""><span>膠囊底板</span>
          </label>
          <label><input type="radio" name="shape" value="rounded">
            <img class="keyring-template" src="assets/keyring/rounded.svg" alt=""><span>圓角底板</span>
          </label>
        </fieldset>
        <p class="nameplate-order-note">統一預覽規格：最長 65 mm，底板與凸字總厚 4 mm。</p>
        <button class="button yellow" id="keyring-next" type="submit" disabled>下一步：選顏色</button>
      </section>
      <section class="keyring-step" id="keyring-colors" hidden>
        <h2 tabindex="-1">選顏色</h2>
        <fieldset class="keyring-print-mode">
          <legend>列印方式</legend>
          <label><input type="radio" name="mode" value="single"> 單色</label>
          <label><input type="radio" name="mode" value="dual" checked> 雙色</label>
        </fieldset>
        <div class="nameplate-field">
          <label for="plate-base-color">顏色 1 · 底板</label>
          <select id="plate-base-color" name="baseColor" data-swatch data-default="#a087c1"></select>
        </div>
        <div id="keyring-multiple-colors">
          <div class="nameplate-field">
            <label for="plate-text-color">顏色 2 · 凸字</label>
            <select id="plate-text-color" name="textColor" data-swatch data-default="#fffcf5"></select>
          </div>
          <label class="keyring-add-color"><input type="checkbox" name="useAccent"> 增加顏色 3</label>
          <div class="nameplate-field" id="keyring-accent" hidden>
            <label for="plate-accent-color">顏色 3 · 底板側邊</label>
            <select id="plate-accent-color" name="accentColor" data-swatch data-default="#f2c879"></select>
          </div>
        </div>
        <template id="plate-swatch-options">
          <option value="#a087c1">薰衣草紫</option>
          <option value="#fffcf5">奶油白</option>
          <option value="#f2c879">蜂蜜金</option>
          <option value="#393142">炭灰</option>
          <option value="#b8d6bd">薄荷綠</option>
          <option value="#efb39e">蜜桃粉</option>
        </template>
        <div class="nameplate-actions">
          <button class="button cream" id="keyring-back" type="button">上一步</button>
          <button class="button yellow" id="keyring-generate" type="submit" disabled>生成預覽圖</button>
          <a class="button cream" id="plate-download" download="OGS-keyring-preview.png" hidden>下載 PNG</a>
          <p id="plate-status" role="status" data-error="預覽圖生成失敗，請再試一次。" data-ready="預覽圖已生成。"></p>
          <p class="nameplate-order-note">正式售價與賣貨便商品連結確認後開放送單。</p>
        </div>
      </section>
    </form>
  </div>
</main>
