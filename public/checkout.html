<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>官網結帳 — One Goods Studio</title>
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="style.css?v=f0ba05b18af6">
  <script src="locale.js?v=f0ba05b18af6" defer></script><script src="app.js?v=f0ba05b18af6" defer></script>
<link rel="canonical" href="https://onegoods.studio/checkout.html"><link rel="alternate" hreflang="zh-Hant" href="https://onegoods.studio/checkout.html"><link rel="alternate" hreflang="zh-Hans" href="https://onegoods.studio/zh-cn/checkout.html"><link rel="alternate" hreflang="en" href="https://onegoods.studio/en/checkout.html"></head>
<body data-page="checkout">
<header><a class="brand" href="index.html" aria-label="One Goods Studio 首頁"><img class="brand-icon" src="assets/icon.png" alt=""><img class="brand-wordmark" src="assets/ogs-wordmark-header.png" alt="OGS"></a><nav aria-label="主要導覽"><a href="index.html">首頁</a><a href="products.html">好物</a><a href="custom.html">客製</a><a href="about.html">關於 OGS</a></nav><nav class="language-switch" aria-label="Language"><details class="language-menu"><summary aria-label="切換語言，目前：繁體中文">繁<span class="language-chevron" aria-hidden="true"></span></summary><div class="language-options"><a href="checkout.html" lang="zh-Hant" hreflang="zh-Hant" data-language="zh-Hant" aria-current="true">繁體中文</a><a href="zh-cn/checkout.html" lang="zh-Hans" hreflang="zh-Hans" data-language="zh-Hans">简体中文</a><a href="en/checkout.html" lang="en" hreflang="en" data-language="en">English</a></div></details></nav></header>
<main class="section store-checkout" id="store-checkout">
  <a id="store-back" class="text-button" href="products.html">返回商品</a>
  <h1>官網結帳</h1>
  <p id="store-preview-note">結帳預覽 · 不會收款或出貨</p>
  <p id="store-loading" role="status">正在載入商品…</p>
  <form id="store-order-form" class="store-order-grid" hidden>
    <section id="store-bag" class="store-order-panel">
      <h2 tabindex="-1">購物袋</h2>
      <div class="store-checkout-item">
        <img id="store-photo" alt="" width="72" height="72" hidden>
        <div><strong id="store-name"></strong><p id="store-unit-price"></p></div>
      </div>
      <label for="store-quantity">數量</label>
      <input id="store-quantity" type="number" value="1" min="1" step="1" max="99" required>
      <div class="store-checkout-actions"><button id="store-to-shipping" class="button yellow" type="button">選擇配送</button></div>
    </section>
    <section id="store-shipping" class="store-order-panel" hidden>
      <h2 tabindex="-1">選擇配送</h2>
      <label for="store-delivery">配送方式</label>
      <select id="store-delivery">
        <option value="pickup">超商取貨 · NT$60</option>
        <option value="home">黑貓宅配 · NT$100</option>
      </select>
      <div id="store-carrier-field">
        <label for="store-carrier">取貨超商</label>
        <select id="store-carrier"><option>7-ELEVEN</option><option>全家</option><option>萊爾富</option></select>
      </div>
      <fieldset id="store-address-fields" hidden disabled>
        <legend>台灣本島配送</legend>
        <label for="store-contact">收件人</label><input id="store-contact" name="contact" autocomplete="shipping name" maxlength="40" required>
        <label for="store-phone">手機號碼</label><input id="store-phone" name="phone" type="tel" autocomplete="shipping tel" maxlength="20" required>
        <label for="store-email">電子郵件</label><input id="store-email" name="email" type="email" autocomplete="email" maxlength="100" required>
        <label for="store-city">縣市</label><input id="store-city" name="city" autocomplete="shipping address-level1" maxlength="12" required>
        <label for="store-district">行政區</label><input id="store-district" name="district" autocomplete="shipping address-level2" maxlength="16" required>
        <label for="store-postal">郵遞區號</label><input id="store-postal" name="postalCode" inputmode="numeric" autocomplete="shipping postal-code" pattern="[0-9]{3}([0-9]{2,3})?" maxlength="6" required>
        <label for="store-street">街道與門牌</label><input id="store-street" name="street" autocomplete="shipping address-line1" maxlength="100" required>
        <label for="store-unit">樓層或室號（選填）</label><input id="store-unit" name="unit" autocomplete="shipping address-line2" maxlength="35">
      </fieldset>
      <div class="store-checkout-actions">
        <button class="button yellow" type="submit">確認訂單內容</button>
        <button id="store-to-bag" class="button cream" type="button">返回購物袋</button>
      </div>
    </section>
    <section id="store-confirmation" class="store-order-panel" hidden>
      <h2 tabindex="-1">確認訂單內容</h2>
      <p id="store-review-item"></p>
      <p id="store-review-shipping"></p><p id="store-review-address" hidden></p><p id="store-payment-error" role="alert" hidden></p>
      <div class="store-checkout-actions">
        <button id="store-pay" class="button yellow" type="submit">前往模擬付款</button>
        <button id="store-edit-shipping" class="button cream" type="button">修改配送</button>
      </div>
    </section>
    <section id="store-payment-demo" class="store-order-panel" hidden>
      <h2 tabindex="-1">付款預覽</h2>
      <p>測試付款無需填寫銀行卡資料。</p>
      <p id="store-demo-payment-error" role="status" hidden>模擬付款未成功，可以重試。</p>
      <div class="store-checkout-actions">
        <button id="store-demo-success" class="button yellow" type="button">模擬付款成功</button>
        <button id="store-demo-failure" class="button cream" type="button">模擬付款失敗</button>
        <button id="store-demo-back" class="button cream" type="button">返回訂單確認</button>
      </div>
    </section>
    <section id="store-receipt" class="store-order-panel" hidden>
      <h2 tabindex="-1">模擬付款已完成</h2>
      <p id="store-receipt-item"></p>
      <p id="store-receipt-shipping"></p>
      <a class="button cream" href="products.html">返回好物</a>
    </section>
    <aside id="store-summary" class="store-order-panel">
      <h2>金額明細</h2>
      <dl aria-live="polite">
        <div><dt>商品小計</dt><dd id="store-subtotal"></dd></div>
        <div><dt>運費</dt><dd id="store-fee"></dd></div>
        <div><dt>合計</dt><dd id="store-total"></dd></div>
      </dl>
    </aside>
  </form>
</main>
</body>
</html>
