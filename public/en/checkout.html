<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>OGS checkout — One Goods Studio</title>
  <link rel="icon" href="../assets/icon.png">
  <link rel="stylesheet" href="../style.css?v=f2f4872b5a3f">
  <script src="../locale.js?v=f2f4872b5a3f" defer></script><script src="app.js?v=f2f4872b5a3f" defer></script>
<link rel="canonical" href="https://onegoods.studio/en/checkout.html"><link rel="alternate" hreflang="zh-Hant" href="https://onegoods.studio/checkout.html"><link rel="alternate" hreflang="zh-Hans" href="https://onegoods.studio/zh-cn/checkout.html"><link rel="alternate" hreflang="en" href="https://onegoods.studio/en/checkout.html"></head>
<body data-page="checkout">
<header><a class="brand" href="index.html" aria-label="One Goods Studio home"><img class="brand-icon" src="../assets/icon.png" alt=""><img class="brand-wordmark" src="../assets/ogs-wordmark-header.png" alt="OGS"></a><nav aria-label="Main navigation"><a href="index.html">Home</a><a href="products.html">Goods</a><a href="custom.html">Customize</a><a href="about.html">About OGS</a></nav><nav class="language-switch" aria-label="Language"><details class="language-menu"><summary aria-label="Change language. Current: English">en<span class="language-chevron" aria-hidden="true"></span></summary><div class="language-options"><a href="../checkout.html" lang="zh-Hant" hreflang="zh-Hant" data-language="zh-Hant">繁體中文</a><a href="../zh-cn/checkout.html" lang="zh-Hans" hreflang="zh-Hans" data-language="zh-Hans">简体中文</a><a href="../en/checkout.html" lang="en" hreflang="en" data-language="en" aria-current="true">English</a></div></details></nav></header>
<main class="section store-checkout" id="store-checkout">
  <a id="store-back" class="text-button" href="products.html">Back to product</a>
  <h1>OGS checkout</h1>
  <p>Checkout preview · No payment or shipment</p>
  <p id="store-loading" role="status">Loading product…</p>
  <form id="store-order-form" class="store-order-grid" hidden>
    <section id="store-bag" class="store-order-panel">
      <h2 tabindex="-1">Shopping bag</h2>
      <div class="store-checkout-item">
        <img id="store-photo" alt="" width="72" height="72" hidden>
        <div><strong id="store-name"></strong><p id="store-unit-price"></p></div>
      </div>
      <label for="store-quantity">Quantity</label>
      <input id="store-quantity" type="number" value="1" min="1" step="1" max="99" required>
      <div class="store-checkout-actions"><button id="store-to-shipping" class="button yellow" type="button">Choose delivery</button></div>
    </section>
    <section id="store-shipping" class="store-order-panel" hidden>
      <h2 tabindex="-1">Choose delivery</h2>
      <label for="store-delivery">Delivery method</label>
      <select id="store-delivery">
        <option value="pickup">Convenience-store pickup · NT$60</option>
        <option value="home">Black Cat home delivery · NT$100</option>
      </select>
      <div id="store-carrier-field">
        <label for="store-carrier">Convenience store</label>
        <select id="store-carrier"><option>7-ELEVEN</option><option>FamilyMart</option><option>Hi-Life</option></select>
      </div>
      <div class="store-checkout-actions">
        <button class="button yellow" type="submit">Review order</button>
        <button id="store-to-bag" class="button cream" type="button">Back to shopping bag</button>
      </div>
    </section>
    <section id="store-confirmation" class="store-order-panel" hidden>
      <h2 tabindex="-1">Review order</h2>
      <p id="store-review-item"></p>
      <p id="store-review-shipping"></p>
      <div class="store-checkout-actions">
        <button class="button yellow" type="submit">Finish checkout preview</button>
        <button id="store-edit-shipping" class="button cream" type="button">Edit delivery</button>
      </div>
    </section>
    <section id="store-receipt" class="store-order-panel" hidden>
      <h2 tabindex="-1">Checkout preview complete</h2>
      <a class="button cream" href="products.html">Back to shop</a>
    </section>
    <aside id="store-summary" class="store-order-panel">
      <h2>Price breakdown</h2>
      <dl aria-live="polite">
        <div><dt>Subtotal</dt><dd id="store-subtotal"></dd></div>
        <div><dt>Shipping</dt><dd id="store-fee"></dd></div>
        <div><dt>Total</dt><dd id="store-total"></dd></div>
      </dl>
    </aside>
  </form>
</main>
</body>
</html>
