<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#a087c1">
  <title>客制名牌 — One Goods Studio</title>
  <meta name="description" content="输入名字、选择款式和配色，即时预览你的 3D 打印名牌。">
  <link rel="icon" href="assets/icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="nameplate.js" defer></script>
</head>
<body data-page="nameplate">
<header><a class="brand" href="index.html" aria-label="One Goods Studio 首页"><img class="brand-icon" src="assets/icon.png" alt=""><img class="brand-wordmark" src="assets/ogs-wordmark-header.png" alt="OGS"></a><nav aria-label="主导航"><a href="index.html">首页</a><a href="products.html">好物</a><a href="nameplate.html" aria-current="page">客制名牌</a><a href="about.html">关于 OGS</a></nav></header><nav class="catalog-nav" aria-label="主导航"><a href="index.html">首页</a><a href="products.html">好物</a><a href="nameplate.html" aria-current="page">客制名牌</a><a href="about.html">关于 OGS</a></nav>

<main class="section nameplate-page">
  <div class="nameplate-heading">
    <span class="eyebrow">OGS / NAMEPLATE STUDIO</span>
    <h1>客制你的名牌。</h1>
    <p>输入名字、选择款式和配色，即时预览你的 3D 打印名牌。</p>
  </div>
  <div class="nameplate-workspace">
    <figure class="nameplate-stage">
      <span class="eyebrow">LIVE PREVIEW</span>
      <svg id="plate-preview" viewBox="0 0 660 240" role="img" aria-label="名牌即时预览">
        <rect class="plate-side" x="30" y="52" width="600" height="152" rx="24"/>
        <rect class="plate-base" x="30" y="38" width="600" height="152" rx="24"/>
        <g id="plate-lettering" font-size="66" font-weight="800" text-anchor="middle">
          <use href="#plate-text" y="5" class="plate-shadow" aria-hidden="true"/>
          <text id="plate-text" x="330" y="116" dominant-baseline="central">你的名字</text>
        </g>
      </svg>
      <figcaption>画面为设计示意，实际成品颜色与尺寸依制作确认为准。</figcaption>
    </figure>
    <form id="nameplate-form" class="nameplate-form">
      <h2>设定你的名牌</h2>
      <div class="nameplate-field">
        <label for="plate-name">名牌文字</label>
        <input id="plate-name" name="nameText" maxlength="20" placeholder="你的名字" required autocomplete="off">
      </div>
      <div class="nameplate-options">
        <div class="nameplate-field">
          <label for="plate-shape">外形款式</label>
          <select id="plate-shape" name="shape">
            <option value="rounded">圆角方形</option>
            <option value="pill">胶囊形</option>
          </select>
        </div>
        <div class="nameplate-field">
          <label for="plate-palette">名牌配色</label>
          <select id="plate-palette" name="palette">
            <option value="lavender">薰衣草紫 × 奶油白</option>
            <option value="honey">蜂蜜金 × 深灰</option>
            <option value="charcoal">炭灰 × 奶油白</option>
          </select>
        </div>
      </div>
      <div class="nameplate-field">
        <label for="plate-summary">客制内容</label>
        <textarea id="plate-summary" rows="3" readonly></textarea>
      </div>
      <button class="button yellow" type="submit">复制客制内容</button>
      <p id="plate-status" role="status" data-copied="已复制客制内容。" data-manual="已选取客制内容，请手动复制。"></p>
    </form>
  </div>
</main>
<footer><div class="footer-brand">One Goods Studio<span>解压、有趣，自成一格。</span></div><div><a href="index.html">首页</a><a href="products.html">好物</a><a href="nameplate.html">客制名牌</a><a href="about.html">关于 OGS</a></div><small>© 2026 One Goods Studio</small></footer>
</body>
</html>
